{% extends 'main/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Регистрация{% endblock %}

{% block content %}

<!-- Контейнер регистрации -->
<div class="max-width-440 mx-auto px-4 py-5">
    <div class="px-4 py-5">
        <h2 class="section-title text-center mb-4">Регистрация</h2>

        <div style="background: var(--card-bg);
                     backdrop-filter: blur(20px);
                     -webkit-backdrop-filter: blur(20px);
                     border: 1px solid var(--glass-border);
                     border-radius: var(--card-radius);
                     padding: 2rem;
                     box-shadow: var(--shadow-lg);">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit"
                        style="background: var(--accent);
                               border: none;
                               color: #0B0B0B;
                               padding: 12px;
                               width: 100%;
                               border-radius: 25px;
                               font-weight: 600;
                               cursor: pointer;
                               transition: background 0.2s, transform 0.1s;
                               box-shadow: 0 4px 12px rgba(255,107,53,0.32);"
                        onmouseover="this.style.background='var(--accent-glow)'"
                        onmouseout="this.style.background='var(--accent)'"
                        onmousedown="this.style.transform='scale(0.97)'"
                        onmouseup="this.style.transform='scale(1)'">
                    Зарегистрироваться
                </button>
            </form>
        </div>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-dim);">
            Уже есть аккаунт?
            <a href="{% url 'login' %}"
               style="color: var(--accent); text-decoration: none; font-weight: 500;"
               onmouseover="this.style.color='#fff'"
               onmouseout="this.style.color='var(--accent)'">
                Войти
            </a>
        </p>
    </div>

{% endblock %}
