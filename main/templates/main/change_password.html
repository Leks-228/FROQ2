{% extends 'main/base.html' %}
{% block title %}Сменить пароль{% endblock %}

{% block content %}

<!-- Контейнер смены пароля -->
<div class="max-width-500 mx-auto px-4 py-5">
    <div class="px-4 py-5">
        <h2 class="section-title mb-4">Сменить пароль</h2>

        <form method="post"
              hx-post="{% url 'change_password' %}"
              hx-target="#main-content"
              hx-select="#main-content"
              hx-swap="outerHTML"
              hx-push-url="true"
              style="background: var(--card-bg);
                     backdrop-filter: blur(20px);
                     -webkit-backdrop-filter: blur(20px);
                     border: 1px solid var(--glass-border);
                     border-radius: var(--card-radius);
                     padding: 2.5rem;
                     box-shadow: var(--shadow-lg);">
            {% csrf_token %}

            <div style="color: var(--text);">
                {{ form.as_p }}
            </div>

            <div style="display: flex; gap: 12px; margin-top: 1.5rem; justify-content: flex-end;">
                <button type="submit"
                        style="background: var(--accent);
                               border: none;
                               color: #0B0B0B;
                               padding: 10px 24px;
                               border-radius: 25px;
                               font-weight: 600;
                               cursor: pointer;
                               transition: background 0.2s, transform 0.1s;
                               box-shadow: 0 4px 12px rgba(255,107,53,0.32);"
                        onmouseover="this.style.background='var(--accent-glow)'"
                        onmouseout="this.style.background='var(--accent)'"
                        onmousedown="this.style.transform='scale(0.97)'"
                        onmouseup="this.style.transform='scale(1)'">
                    Сменить пароль
                </button>

                <a href="{% url 'profile' %}"
                   hx-get="{% url 'profile' %}"
                   hx-target="#main-content"
                   hx-select="#main-content"
                   hx-swap="outerHTML"
                   hx-push-url="true"
                   style="background: transparent;
                          border: 1px solid var(--glass-border);
                          color: var(--text-dim);
                          padding: 10px 24px;
                          border-radius: 25px;
                          text-decoration: none;
                          font-weight: 500;
                          transition: 0.2s, color 0.2s;
                          display: inline-flex;
                          align-items: center;"
                   onmouseover="this.style.background='rgba(255,107,53,0.14)'; this.style.color='#fff';"
                   onmouseout="this.style.background='transparent'; this.style.color='var(--text-dim)';">
                    Отмена
                </a>
            </div>
        </form>
    </div>
{% endblock %}
