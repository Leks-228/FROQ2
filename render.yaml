services:
  - type: web
    plan: free
    name: music-player-sasha
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn music_site.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      # Версия Python (можно не указывать — Render возьмёт свою по умолчанию)
      - key: PYTHON_VERSION
        value: "3.12.10"

      # Строка подключения к бесплатной базе Neon (postgresql://...)
      # Значение вводится в панели Render при создании сервиса.
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false

      # Файлы (обложки, фото, mp3) будут храниться в Cloudinary.
      # Значения нужно ввести в панели Render при создании сервиса.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Администратор создаётся автоматически при первом деплое.
      # Пароль введите в панели Render (в файл он не попадает).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
